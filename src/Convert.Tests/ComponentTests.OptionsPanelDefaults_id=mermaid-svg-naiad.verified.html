<div class="options-host options-grid"><div class="option option-flag"><input id="option-pretty-print" type="checkbox" checked blazor:onchange="1" />
    <label for="option-pretty-print">Pretty print</label><p class="option-hint">Indent the output, one element per line.</p></div><details class="advanced-options"><summary>More options</summary>
    <div class="options-grid"><div class="option"><label for="option-font-size">Font size</label>
    <input id="option-font-size" type="number" value="14" min="6" max="48" step="1" blazor:onchange="2" /></div>
    <div class="option"><label for="option-font-family">Font family</label>
    <input id="option-font-family" type="text" value="Arial, sans-serif" blazor:onchange="3" /></div>
    <div class="option"><label for="option-padding">Padding</label>
    <input id="option-padding" type="number" value="20" min="0" max="200" step="1" blazor:onchange="4" /></div><div class="option option-flag"><input id="option-html-labels" type="checkbox" blazor:onchange="5" />
    <label for="option-html-labels">HTML labels</label><p class="option-hint">Richer labels; the SVG then imports Font Awesome from a CDN.</p></div></div></details></div>
