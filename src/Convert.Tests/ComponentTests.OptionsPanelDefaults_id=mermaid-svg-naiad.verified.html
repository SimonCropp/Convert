<div class="options-host options-grid"><div class="option option-flag"><input id="option-keep-transparency" type="checkbox" blazor:onchange="1" />
    <label for="option-keep-transparency">Keep transparency</label></div><div class="option"><label for="option-background">Background</label>
    <input id="option-background" type="color" value="#ffffff" blazor:onchange="2" /></div><fieldset class="option option-radios"><legend>Layout</legend>
    <label><input type="radio" name="option-layout" checked blazor:onchange="3" />
        Indented
    </label>
    <label><input type="radio" name="option-layout" blazor:onchange="4" />
        Compact
    </label></fieldset><details class="advanced-options"><summary>More options</summary>
    <div class="options-grid"><div class="option"><label for="option-font-size">Font size</label>
    <input id="option-font-size" type="number" value="14" min="6" max="48" step="1" blazor:onchange="5" /></div>
    <div class="option"><label for="option-font-family">Font family</label>
    <input id="option-font-family" type="text" value="Arial, sans-serif" blazor:onchange="6" /></div>
    <div class="option"><label for="option-padding">Padding</label>
    <input id="option-padding" type="number" value="20" min="0" max="200" step="1" blazor:onchange="7" /></div><div class="option option-flag"><input id="option-html-labels" type="checkbox" blazor:onchange="8" />
    <label for="option-html-labels">HTML labels</label><p class="option-hint">Richer labels; the SVG then imports Font Awesome from a CDN.</p></div></div></details></div>
