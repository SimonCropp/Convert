<div class="options-host options-grid"><div class="option option-flag"><input id="option-full-html-document" type="checkbox" checked blazor:onchange="1" />
    <label for="option-full-html-document">Full HTML document</label><p class="option-hint">With &lt;html&gt;, &lt;head&gt; and a readable stylesheet; off for a body fragment.</p></div>
<fieldset class="option option-radios"><legend>Layout</legend>
    <label><input type="radio" name="option-layout" checked blazor:onchange="2" />
        Indented
    </label>
    <label><input type="radio" name="option-layout" blazor:onchange="3" />
        Compact
    </label></fieldset>
<details class="advanced-options"><summary>More options</summary>
    <div class="options-grid"><div class="option option-flag"><input id="option-advanced-extensions" type="checkbox" checked blazor:onchange="4" />
    <label for="option-advanced-extensions">Advanced extensions</label><p class="option-hint">Tables, footnotes, task lists, auto-links and more.</p></div>
    <div class="option option-flag"><input id="option-pipe-tables" type="checkbox" checked blazor:onchange="5" />
    <label for="option-pipe-tables">Pipe tables</label></div>
    <div class="option option-flag"><input id="option-line-breaks-are-hard-breaks" type="checkbox" blazor:onchange="6" />
    <label for="option-line-breaks-are-hard-breaks">Line breaks are hard breaks</label></div>
    <div class="option option-flag"><input id="option-emoji-shortcodes" type="checkbox" blazor:onchange="7" />
    <label for="option-emoji-shortcodes">Emoji shortcodes</label></div></div></details></div>
