<div class="options-host options-grid"><div class="option"><label for="option-projection">Projection</label>
    <select id="option-projection" blazor:onchange="1"><option value="0" selected>Automatic</option><option value="1">Plate carrée (equirectangular)</option><option value="2">Web Mercator</option><option value="3">Lambert conformal conic</option><option value="4">Goode homolosine</option></select></div>
<div class="option"><label for="option-longest-side--px-">Longest side (px)</label>
    <input id="option-longest-side--px-" type="number" value="2048" min="64" max="8192" step="64" blazor:onchange="2" /></div>
<div class="option option-flag"><input id="option-labels" type="checkbox" blazor:onchange="3" />
    <label for="option-labels">Labels</label><p class="option-hint">From each feature's name property.</p></div>
<div class="option"><label for="option-fill">Fill</label>
    <input id="option-fill" type="color" value="#4682b4" blazor:onchange="4" /></div>
<div class="option"><label for="option-stroke">Stroke</label>
    <input id="option-stroke" type="color" value="#1e1e1e" blazor:onchange="5" /></div><fieldset class="option option-radios"><legend>Layout</legend>
    <label><input type="radio" name="option-layout" checked blazor:onchange="6" />
        Indented
    </label>
    <label><input type="radio" name="option-layout" blazor:onchange="7" />
        Compact
    </label></fieldset><details class="advanced-options"><summary>More options</summary>
    <div class="options-grid"><div class="option"><label for="option-fill-opacity--0-255-">Fill opacity (0–255)</label>
    <input id="option-fill-opacity--0-255-" type="number" value="120" min="0" max="255" step="5" blazor:onchange="8" /></div>
    <div class="option"><label for="option-background">Background</label>
    <input id="option-background" type="color" value="#ffffff" blazor:onchange="9" /></div>
    <div class="option option-flag"><input id="option-ocean" type="checkbox" checked blazor:onchange="10" />
    <label for="option-ocean">Ocean</label><p class="option-hint">Paint the projection's world envelope as sea.</p></div><div class="option"><label for="option-ocean-colour">Ocean colour</label>
    <input id="option-ocean-colour" type="color" value="#c8dcf0" blazor:onchange="11" /></div><div class="option"><label for="option-padding--px-">Padding (px)</label>
    <input id="option-padding--px-" type="number" value="8" min="0" max="256" step="1" blazor:onchange="12" /></div>
    <div class="option"><label for="option-stroke-width--px-">Stroke width (px)</label>
    <input id="option-stroke-width--px-" type="number" value="2" min="0" max="32" step="1" blazor:onchange="13" /></div>
    <div class="option option-flag"><input id="option-scale-strokes-with-size" type="checkbox" checked blazor:onchange="14" />
    <label for="option-scale-strokes-with-size">Scale strokes with size</label></div>
    <div class="option"><label for="option-point-radius--px-">Point radius (px)</label>
    <input id="option-point-radius--px-" type="number" value="4" min="1" max="64" step="1" blazor:onchange="15" /></div>
    <div class="option"><label for="option-smallest-feature-drawn--px-">Smallest feature drawn (px)</label>
    <input id="option-smallest-feature-drawn--px-" type="number" value="1" min="0" max="16" step="0.5" blazor:onchange="16" /></div><div class="option"><label for="option-simplify-tolerance--px-">Simplify tolerance (px)</label>
    <input id="option-simplify-tolerance--px-" type="number" value="0" min="0" max="10" step="0.1" blazor:onchange="17" /><p class="option-hint">0 keeps every vertex.</p></div></div></details></div>
