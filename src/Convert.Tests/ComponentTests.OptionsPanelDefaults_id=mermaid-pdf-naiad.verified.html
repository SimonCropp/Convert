<div class="options-host options-grid"><details class="advanced-options"><summary>More options</summary>
    <div class="options-grid"><div class="option"><label for="option-font-size">Font size</label>
    <input id="option-font-size" type="number" value="14" min="6" max="48" step="1" blazor:onchange="1" /></div>
    <div class="option"><label for="option-font-family">Font family</label>
    <input id="option-font-family" type="text" value="Arial, sans-serif" blazor:onchange="2" /></div>
    <div class="option"><label for="option-padding">Padding</label>
    <input id="option-padding" type="number" value="20" min="0" max="200" step="1" blazor:onchange="3" /></div></div></details></div>
