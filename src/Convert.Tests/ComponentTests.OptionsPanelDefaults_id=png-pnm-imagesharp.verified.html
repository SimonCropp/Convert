<div class="options-host options-grid">
  <div class="option">
    <label for="option-scale">Scale</label>
    <input id="option-scale" type="number" value="1" min="0.1" max="8" step="0.25" blazor:onchange="1">
    <p class="option-hint">1 keeps the source size; 2 doubles it.</p>
  </div>
  <div class="option">
    <label for="option-background">Background</label>
    <input id="option-background" type="color" value="#ffffff" blazor:onchange="2">
  </div>
</div>
