<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convert — files, in your browser</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <base href="/" />
    <link rel="preload" href="_content/Convert.Core/convert.css" as="style" />
    <link rel="preload" href="css/app.css" as="style" />
    <link rel="preload" href="_framework/blazor.webassembly.js" as="script" />
    <link rel="preload" href="js/interop.js" as="script" />
    <!-- Morph's viewer stylesheet (75 KB) is linked eagerly; its fonts are not preloaded, since only
         Office files need them and they are 940 KB. Core's then this app's, so each can override the last. -->
    <link rel="stylesheet" href="_content/Morph.Blazor/morph.css" />
    <link rel="stylesheet" href="_content/Convert.Core/convert.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
            <p class="loading-message">Loading Convert...</p>
            <p class="loading-version"></p>
            <p class="loading-error" hidden></p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">X</a>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="js/interop.js"></script>
    <!-- Written by the build (Convert.Web.csproj's WriteVersionScript): window.convertVersion. -->
    <script src="js/version.js"></script>
    <script>
        window.themeManager.initializeTheme();

        // The loading screen says which build it is, and why it stopped if the app cannot start: a boot
        // failure is otherwise only in the console, which a phone does not show.
        (() => {
            const loading = document.querySelector('#app .loading');
            loading.querySelector('.loading-version').textContent = window.convertVersion ?? '';
            const fail = reason => {
                if (!loading.isConnected) {
                    return;
                }

                loading.classList.add('failed');
                loading.querySelector('.loading-message').textContent = 'Convert could not start';
                const error = loading.querySelector('.loading-error');
                error.textContent = String(reason?.message ?? reason ?? 'Unknown error');
                error.hidden = false;
            };
            addEventListener('error', event => fail(event.error ?? event.message));
            addEventListener('unhandledrejection', event => fail(event.reason));

            if (typeof WebAssembly !== 'object') {
                fail('This browser has WebAssembly turned off, and Convert runs on it. On an iPhone or iPad, Lockdown Mode turns it off.');
                return;
            }

            Blazor.start().catch(fail);
        })();
    </script>
</body>

</html>
