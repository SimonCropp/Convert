name: Deploy GH Pages

# Builds, tests and deploys Convert.Web to GitHub Pages. Convert.Web and Convert.Tests are excluded from
# Release solution builds (they need the wasm-tools workload), so they are built here by path.
#
# The tests run on Windows: their screenshot snapshots are recorded there. The site is published on
# Linux, interpreted (no AOT: see docs/todo.md). A pull request builds and tests but does not deploy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys queue behind one another and are never cancelled. A pull request gets a group of its own, and a
# new push supersedes its previous run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The SDK goes into a directory of the job's own so it is cached with the wasm-tools workload in it.
      - name: Cache .NET SDK and wasm-tools
        id: dotnet-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dotnet
          key: dotnet-wasm-tools-${{ runner.os }}-${{ hashFiles('global.json') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install wasm-tools workload
        if: steps.dotnet-cache.outputs.cache-hit != 'true'
        run: dotnet workload install wasm-tools

      - name: Build tests (also publishes the app for the browser tests)
        run: dotnet build src/Convert.Tests --configuration Release

      - name: Read Playwright version
        id: playwright
        shell: bash
        run: |
          version="$(sed -n 's/.*Microsoft\.Playwright" Version="\([^"]*\)".*/\1/p' src/Directory.Packages.props)"
          if [[ -z "$version" ]]; then
            echo "Could not read the Microsoft.Playwright version from src/Directory.Packages.props" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # TUnit runs on Microsoft.Testing.Platform: run the executable, not `dotnet test`.
      - name: Run tests
        run: dotnet src/Convert.Tests/bin/Release/net11.0/Convert.Tests.dll

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish src/Convert.Web --configuration Release --output publish

      - name: Add .nojekyll file
        if: github.event_name != 'pull_request'
        run: touch publish/wwwroot/.nojekyll

      # Served from the project subpath until a custom domain exists.
      - name: Rewrite base href for GitHub Pages
        if: github.event_name != 'pull_request'
        run: sed -i 's#<base href="/" />#<base href="/Convert/" />#' publish/wwwroot/index.html

      - name: Copy index.html to 404.html for SPA routing
        if: github.event_name != 'pull_request'
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
